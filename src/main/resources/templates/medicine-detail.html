<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/theme.css"/>
<script src="/theme.js"></script>
    <title th:text="${medicine.name} + ' - MediShop'"></title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f6f8; }
        .navbar { background: #0d5c35; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; }
        .navbar .logo { color: white; font-size: 20px; font-weight: 700; }
        .nav-links a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 13px; padding: 7px 14px; border-radius: 7px; margin-left: 4px; transition: all 0.2s; }
        .nav-links a:hover { background: rgba(255,255,255,0.15); }
        .container { max-width: 900px; margin: 32px auto; padding: 0 20px; }
        .back-link { font-size: 13px; color: #1a7a4a; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; font-weight: 600; }
        .detail-card { background: white; border-radius: 16px; overflow: hidden; border: 1px solid #eee; display: flex; gap: 0; }
        .med-img { background: linear-gradient(135deg, #e8f5ee, #f0faf5); width: 300px; min-height: 300px; display: flex; align-items: center; justify-content: center; font-size: 80px; flex-shrink: 0; }
        .med-info { padding: 32px; flex: 1; }
        .med-name { font-size: 26px; font-weight: 700; color: #1a1a1a; margin-bottom: 6px; }
        .med-brand { font-size: 14px; color: #888; margin-bottom: 14px; }
        .badge-row { display: flex; gap: 8px; margin-bottom: 20px; }
        .rx { background: #fff0f0; color: #c0392b; font-size: 12px; padding: 4px 12px; border-radius: 6px; font-weight: 700; }
        .otc { background: #e8f5ee; color: #0d5c35; font-size: 12px; padding: 4px 12px; border-radius: 6px; font-weight: 700; }
        .cat-tag { background: #f0f0f0; color: #555; font-size: 12px; padding: 4px 12px; border-radius: 6px; font-weight: 600; }
        .price { font-size: 32px; font-weight: 700; color: #0d5c35; margin-bottom: 8px; }
        .stock { font-size: 13px; color: #888; margin-bottom: 20px; }
        .stock span { color: #1a7a4a; font-weight: 700; }
        .description { font-size: 14px; color: #555; line-height: 1.7; margin-bottom: 24px; padding: 16px; background: #f8fffe; border-radius: 10px; border-left: 3px solid #1a7a4a; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .info-item { background: #f8f8f8; border-radius: 10px; padding: 14px; }
        .info-label { font-size: 11px; color: #999; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
        .info-val { font-size: 15px; font-weight: 700; color: #1a1a1a; }
        .add-form { display: flex; gap: 10px; align-items: center; }
        .qty-input { width: 80px; padding: 11px 14px; border: 1.5px solid #e8e8e8; border-radius: 8px; font-size: 14px; outline: none; }
        .add-btn { padding: 11px 28px; background: #1a7a4a; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .add-btn:hover { background: #0d5c35; }
        @media (max-width: 700px) {
            .detail-card { flex-direction: column; }
            .med-img { width: 100%; height: 180px; font-size: 60px; }
        }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo">💊 MediShop</div>
    <div class="nav-links">
        <a href="/shop">Shop</a>
        <a href="/cart">Cart</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">
    <a href="/shop" class="back-link">← Back to Shop</a>

    <div class="detail-card" th:if="${medicine}">
        <div class="med-img">💊</div>
        <div class="med-info">
            <div class="med-name" th:text="${medicine.name}"></div>
            <div class="med-brand">by <span th:text="${medicine.brand}"></span></div>
            <div class="badge-row">
                <span class="rx" th:if="${medicine.requiresPrescription}">Rx Required</span>
                <span class="otc" th:unless="${medicine.requiresPrescription}">OTC</span>
                <span class="cat-tag" th:text="${medicine.category}"></span>
            </div>
            <div class="price" th:text="'₹' + ${medicine.price}"></div>
            <div class="stock">In Stock: <span th:text="${medicine.stock}"></span> units</div>

            <div class="description" th:text="${medicine.description}"></div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Brand</div>
                    <div class="info-val" th:text="${medicine.brand}"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">Category</div>
                    <div class="info-val" th:text="${medicine.category}"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">Price</div>
                    <div class="info-val" th:text="'₹' + ${medicine.price}"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">Prescription</div>
                    <div class="info-val" th:text="${medicine.requiresPrescription} ? 'Required' : 'Not Required'"></div>
                </div>
            </div>

            <form class="add-form" method="post" action="/cart/add">
                <input type="hidden" name="medicineId" th:value="${medicine.id}"/>
                <input class="qty-input" type="number" name="quantity" value="1" min="1" max="10"/>
                <button class="add-btn" type="submit">+ Add to Cart</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
