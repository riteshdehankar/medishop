<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/theme.css"/>
<script src="/theme.js"></script>
    <title>Settings - MediShop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f6f8; transition: background 0.3s, color 0.3s; }
        body.dark { background: #1a1a2e; color: #e0e0e0; }
        .navbar { background: #0d5c35; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; }
        .navbar .logo { color: white; font-size: 20px; font-weight: 700; }
        .nav-links a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 13px; padding: 7px 14px; border-radius: 7px; margin-left: 4px; transition: all 0.2s; }
        .nav-links a:hover { background: rgba(255,255,255,0.15); }
        .container { max-width: 640px; margin: 40px auto; padding: 0 20px; }
        h2 { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 24px; }
        body.dark h2 { color: #e0e0e0; }
        .card { background: white; border-radius: 14px; padding: 24px; margin-bottom: 16px; border: 1px solid #eee; }
        body.dark .card { background: #16213e; border-color: #2a2a4a; }
        .card-title { font-size: 15px; font-weight: 700; color: #1a1a1a; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #f0f0f0; }
        body.dark .card-title { color: #e0e0e0; border-color: #2a2a4a; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f8f8f8; }
        .setting-row:last-child { border-bottom: none; }
        .setting-label { font-size: 14px; color: #333; }
        body.dark .setting-label { color: #ccc; }
        .setting-desc { font-size: 12px; color: #999; margin-top: 2px; }
        .toggle { position: relative; width: 44px; height: 24px; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ddd; border-radius: 24px; transition: 0.3s; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
        input:checked + .slider { background: #1a7a4a; }
        input:checked + .slider:before { transform: translateX(20px); }
        .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
        .lang-btn { padding: 10px; border: 1.5px solid #e0e0e0; border-radius: 8px; background: white; font-size: 13px; cursor: pointer; transition: all 0.2s; text-align: center; font-weight: 500; }
        body.dark .lang-btn { background: #1a2744; border-color: #2a3a5a; color: #ccc; }
        .lang-btn:hover { border-color: #1a7a4a; color: #1a7a4a; }
        .lang-btn.active { border-color: #1a7a4a; background: #e8f5ee; color: #0d5c35; font-weight: 700; }
        body.dark .lang-btn.active { background: #0d3320; }
        .save-btn { width: 100%; padding: 12px; background: #1a7a4a; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
        .save-btn:hover { background: #0d5c35; }
    </style>
</head>
<body id="body">
<div class="navbar">
    <div class="logo">💊 MediShop</div>
    <div class="nav-links">
        <a href="/shop">Shop</a>
        <a href="/orders">Orders</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">
    <h2>Settings</h2>

    <!-- Appearance -->
    <div class="card">
        <div class="card-title">Appearance</div>
        <div class="setting-row">
            <div>
                <div class="setting-label">Dark Mode</div>
                <div class="setting-desc">Switch between light and dark theme</div>
            </div>
            <label class="toggle">
                <input type="checkbox" id="darkToggle" onchange="toggleDark(this)"/>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- Language -->
    <div class="card">
        <div class="card-title">Language</div>
        <div class="lang-grid">
            <button class="lang-btn active" id="lang-en" onclick="setLang('en')">🇬🇧 English</button>
            <button class="lang-btn" id="lang-hi" onclick="setLang('hi')">🇮🇳 Hindi</button>
            <button class="lang-btn" id="lang-mr" onclick="setLang('mr')">🟠 Marathi</button>
            <button class="lang-btn" id="lang-ta" onclick="setLang('ta')">🔵 Tamil</button>
            <button class="lang-btn" id="lang-te" onclick="setLang('te')">🟣 Telugu</button>
        </div>
        <p style="font-size:12px;color:#999;margin-top:12px;">* Full language support coming soon. Currently displays in English.</p>
    </div>

    <!-- Account Info -->
    <div class="card">
        <div class="card-title">Account</div>
        <div class="setting-row">
            <div>
                <div class="setting-label" th:text="${session.user.name}"></div>
                <div class="setting-desc" th:text="${session.user.email}"></div>
            </div>
            <span style="background:#e8f5ee;color:#0d5c35;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;" th:text="${session.user.role}"></span>
        </div>
    </div>
</div>

<script src="/theme.js"></script>
<script>
    window.onload = function() {
        // Dark mode
        const dark = localStorage.getItem('darkMode') === 'true';
        document.getElementById('darkToggle').checked = dark;
        applyDarkMode(dark);

        // Language
        const lang = localStorage.getItem('lang') || 'en';
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('lang-' + lang);
        if (btn) btn.classList.add('active');
        applyLanguage(lang);
    }

    function toggleDark(el) {
        applyDarkMode(el.checked);
    }

    function setLang(lang) {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('lang-' + lang);
        if (btn) btn.classList.add('active');
        applyLanguage(lang);
    }
</script>
</body>
</html>
