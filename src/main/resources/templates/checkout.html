<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/theme.css"/>
<script src="/theme.js"></script>
    <title>Checkout - MediShop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f5f5f5; }
        .navbar { background: #1a7a4a; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .navbar .logo { color: white; font-size: 20px; font-weight: bold; }
        .navbar a { color: white; text-decoration: none; margin-left: 16px; }
        .container { max-width: 700px; margin: 24px auto; padding: 0 16px; }
        h2 { margin-bottom: 16px; }
        .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 16px; border: 1px solid #eee; }
        .item-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        .total { font-size: 18px; font-weight: bold; color: #1a7a4a; text-align: right; margin-top: 12px; }
        textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; resize: vertical; }
        label { font-size: 14px; font-weight: bold; display: block; margin-bottom: 6px; }
        .btn { width: 100%; padding: 12px; background: #1a7a4a; color: white; border: none; border-radius: 7px; font-size: 16px; cursor: pointer; margin-top: 12px; }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo">💊 MediShop</div>
    <div>
        <a href="/shop">Shop</a>
        <a href="/cart">Cart</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">
    <h2>Checkout</h2>

    <div class="card">
        <h3 style="margin-bottom:12px;">Order Summary</h3>
        <div th:each="item : ${cartItems}" class="item-row">
            <span th:text="${item.medicine.name} + ' x' + ${item.quantity}"></span>
            <span th:text="'₹' + ${item.medicine.price * item.quantity}"></span>
        </div>
        <div class="total">Total: ₹<span th:text="${total}"></span></div>
    </div>

    <div class="card">
        <form method="post" action="/checkout/place">
            <label>Delivery Address</label>
            <textarea name="address" rows="3" placeholder="Apna poora address likho..." required></textarea>
            <button class="btn" type="submit">Place Order</button>
        </form>
    </div>
</div>
</body>
</html>
