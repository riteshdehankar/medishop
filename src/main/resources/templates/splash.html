<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/theme.css"/>
<script src="/theme.js"></script>
    <title>MediShop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d5c35; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }
        .splash { text-align: center; animation: fadeIn 0.8s ease; }
        .logo-icon { width: 90px; height: 90px; background: white; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 48px; margin: 0 auto 20px; animation: pulse 1.5s ease infinite; }
        .logo-text { font-size: 36px; font-weight: 700; color: white; letter-spacing: 1px; }
        .tagline { font-size: 14px; color: rgba(255,255,255,0.7); margin-top: 8px; letter-spacing: 2px; }
        .loader { margin-top: 40px; display: flex; gap: 8px; justify-content: center; }
        .dot { width: 10px; height: 10px; background: rgba(255,255,255,0.5); border-radius: 50%; animation: bounce 1.2s ease infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes bounce { 0%,100% { transform: translateY(0); opacity: 0.5; } 50% { transform: translateY(-10px); opacity: 1; } }
    </style>
</head>
<body>
    <div class="splash">
        <div class="logo-icon">💊</div>
        <div class="logo-text">MediShop</div>
        <div class="tagline">YOUR TRUSTED PHARMACY</div>
        <div class="loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    <script>
        setTimeout(function() {
            window.location.href = '/shop';
        }, 3000);
    </script>
</body>
</html>
