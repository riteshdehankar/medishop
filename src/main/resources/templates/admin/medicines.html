<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/theme.css"/>
<script src="/theme.js"></script>
    <title>Manage Medicines - MediShop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; }
        .navbar { background: #0a3d24; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .navbar .logo { color: white; font-size: 20px; font-weight: 700; }
        .nav-links a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 13px; padding: 7px 14px; border-radius: 7px; transition: all 0.2s; margin-left: 4px; }
        .nav-links a:hover { background: rgba(255,255,255,0.15); color: white; }
        .nav-links a.active { background: rgba(255,255,255,0.2); color: white; }
        .container { max-width: 1100px; margin: 28px auto; padding: 0 20px; }
        .page-title { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 20px; }
        .add-form { background: white; border-radius: 14px; padding: 24px; margin-bottom: 28px; border: 1px solid #eee; }
        .add-form h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: #1a1a1a; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .form-grid input, .form-grid select { width: 100%; padding: 10px 12px; border: 1.5px solid #e8e8e8; border-radius: 8px; font-size: 13px; outline: none; transition: border 0.2s; }
        .form-grid input:focus, .form-grid select:focus { border-color: #1a7a4a; }
        .desc-input { width: 100%; padding: 10px 12px; border: 1.5px solid #e8e8e8; border-radius: 8px; font-size: 13px; outline: none; margin-top: 12px; transition: border 0.2s; }
        .desc-input:focus { border-color: #1a7a4a; }
        .add-btn { margin-top: 14px; padding: 11px 28px; background: #1a7a4a; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .add-btn:hover { background: #0d5c35; }
        .section-title { font-size: 17px; font-weight: 700; color: #1a1a1a; margin-bottom: 14px; }
        .table-wrap { background: white; border-radius: 14px; overflow: hidden; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #0a3d24; color: white; padding: 12px 16px; text-align: left; font-size: 13px; font-weight: 600; }
        td { padding: 12px 16px; border-bottom: 1px solid #f5f5f5; font-size: 13px; color: #333; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafafa; }
        .rx-tag { background: #fff0f0; color: #c0392b; font-size: 11px; padding: 3px 8px; border-radius: 5px; font-weight: 600; }
        .otc-tag { background: #e8f5ee; color: #0d5c35; font-size: 11px; padding: 3px 8px; border-radius: 5px; font-weight: 600; }
        .del-btn { background: #fff0f0; color: #e74c3c; border: 1px solid #ffcccc; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; }
        .del-btn:hover { background: #e74c3c; color: white; }
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo">⚕️ Admin Panel</div>
    <div class="nav-links">
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/medicines" class="active">Medicines</a>
        <a href="/shop">View Shop</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">
    <div class="page-title">Manage Medicines</div>

    <div class="add-form">
        <h3>Add New Medicine</h3>
        <form method="post" action="/admin/medicines/add">
            <div class="form-grid">
                <input type="text" name="name" placeholder="Medicine Name" required/>
                <input type="text" name="brand" placeholder="Brand" required/>
                <input type="text" name="category" placeholder="Category" required/>
                <input type="number" name="price" placeholder="Price (₹)" step="0.01" required/>
                <input type="number" name="stock" placeholder="Stock Quantity" required/>
                <select name="requiresPrescription">
                    <option value="false">OTC — No Prescription</option>
                    <option value="true">Rx — Prescription Required</option>
                </select>
            </div>
            <input class="desc-input" type="text" name="description" placeholder="Description (optional)"/>
            <br/>
            <button class="add-btn" type="submit">+ Add Medicine</button>
        </form>
    </div>

    <div class="section-title">All Medicines (<span th:text="${#lists.size(medicines)}"></span>)</div>
    <div class="table-wrap">
        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Brand</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Type</th>
                <th>Action</th>
            </tr>
            <tr th:each="med : ${medicines}">
                <td th:text="${med.id}"></td>
                <td th:text="${med.name}"></td>
                <td th:text="${med.brand}"></td>
                <td th:text="${med.category}"></td>
                <td th:text="'₹' + ${med.price}"></td>
                <td th:text="${med.stock}"></td>
                <td>
                    <span class="rx-tag" th:if="${med.requiresPrescription}">Rx</span>
                    <span class="otc-tag" th:unless="${med.requiresPrescription}">OTC</span>
                </td>
                <td>
                    <a th:href="@{/admin/medicines/delete/{id}(id=${med.id})}">
                        <button class="del-btn">Delete</button>
                    </a>
                </td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
