<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/theme.css"/>
<script src="/theme.js"></script>
    <title>Admin Dashboard - MediShop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; }
        .navbar { background: #0a3d24; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .navbar .logo { color: white; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .nav-links a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 13px; padding: 7px 14px; border-radius: 7px; transition: all 0.2s; margin-left: 4px; }
        .nav-links a:hover { background: rgba(255,255,255,0.15); color: white; }
        .nav-links a.active { background: rgba(255,255,255,0.2); color: white; }
        .container { max-width: 1100px; margin: 28px auto; padding: 0 20px; }
        .page-title { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 20px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
        .stat-card { background: white; border-radius: 14px; padding: 22px; border: 1px solid #eee; display: flex; align-items: center; gap: 16px; }
        .stat-icon { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .stat-icon.green { background: #e8f5ee; }
        .stat-icon.blue { background: #e8f0fe; }
        .stat-icon.orange { background: #fef3e8; }
        .stat-info { flex: 1; }
        .stat-num { font-size: 30px; font-weight: 700; color: #1a1a1a; line-height: 1; }
        .stat-label { font-size: 13px; color: #888; margin-top: 4px; }
        .section-title { font-size: 17px; font-weight: 700; color: #1a1a1a; margin-bottom: 14px; }
        .table-wrap { background: white; border-radius: 14px; overflow: hidden; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #0a3d24; color: white; padding: 12px 16px; text-align: left; font-size: 13px; font-weight: 600; }
        td { padding: 12px 16px; border-bottom: 1px solid #f5f5f5; font-size: 13px; color: #333; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafafa; }
        .status-pill { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .PENDING { background: #fff3cd; color: #856404; }
        .CONFIRMED { background: #d1ecf1; color: #0c5460; }
        .SHIPPED { background: #cce5ff; color: #004085; }
        .DELIVERED { background: #d4edda; color: #155724; }
        select { padding: 5px 8px; border: 1.5px solid #e0e0e0; border-radius: 6px; font-size: 12px; outline: none; }
        .update-btn { background: #1a7a4a; color: white; border: none; padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .update-btn:hover { background: #0d5c35; }
        @media (max-width: 768px) {
            .stats { grid-template-columns: 1fr; }
            .navbar { padding: 12px 16px; }
        }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo">⚕️ Admin Panel</div>
    <div class="nav-links">
        <a href="/admin/dashboard" class="active">Dashboard</a>
        <a href="/admin/medicines">Medicines</a>
        <a href="/shop">View Shop</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">
    <div class="page-title">Dashboard Overview</div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-icon green">💊</div>
            <div class="stat-info">
                <div class="stat-num" th:text="${totalMedicines}"></div>
                <div class="stat-label">Total Medicines</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon blue">📦</div>
            <div class="stat-info">
                <div class="stat-num" th:text="${totalOrders}"></div>
                <div class="stat-label">Total Orders</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon orange">👥</div>
            <div class="stat-info">
                <div class="stat-num" th:text="${totalUsers}"></div>
                <div class="stat-label">Registered Users</div>
            </div>
        </div>
    </div>
<!-- Low Stock Alert -->
<div th:if="${!#lists.isEmpty(lowStock)}"
     style="background:#fff3cd;border:1px solid #ffc107;border-radius:12px;padding:16px 20px;margin-bottom:24px;">
    <div style="font-size:15px;font-weight:700;color:#856404;margin-bottom:10px;">
        ⚠ Low Stock Alert (<span th:text="${#lists.size(lowStock)}"></span> medicines)
    </div>
    <div th:each="med : ${lowStock}"
         style="display:flex;justify-content:space-between;font-size:13px;color:#856404;padding:4px 0;border-bottom:1px solid rgba(0,0,0,0.05);">
        <span th:text="${med.name}"></span>
        <span style="font-weight:700;">Stock: <span th:text="${med.stock}"></span></span>
    </div>
</div>
    <div class="section-title">Manage Orders</div>
    <div class="table-wrap">
        <table>
            <tr>
                <th>Order ID</th>
                <th>User ID</th>
                <th>Amount</th>
                <th>Address</th>
                <th>Status</th>
                <th>Update Status</th>
            </tr>
            <tr th:each="order : ${orders}">
                <td>#<span th:text="${order.id}"></span></td>
                <td th:text="${order.userId}"></td>
                <td th:text="'₹' + ${order.totalAmount}"></td>
                <td th:text="${order.address}"></td>
                <td><span class="status-pill" th:classappend="${order.status}" th:text="${order.status}"></span></td>
                <td>
                    <form method="post" action="/admin/orders/status" style="display:flex;gap:6px;align-items:center;">
                        <input type="hidden" name="orderId" th:value="${order.id}"/>
                        <select name="status">
                            <option value="PENDING">Pending</option>
                            <option value="CONFIRMED">Confirmed</option>
                            <option value="SHIPPED">Shipped</option>
                            <option value="DELIVERED">Delivered</option>
                        </select>
                        <button class="update-btn" type="submit">Update</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
