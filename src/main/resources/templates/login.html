<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/theme.css"/>
<script src="/theme.js"></script>
    <title>Login - MediShop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #0d5c35, #1a7a4a); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 860px; height: 520px; background: white; border-radius: 20px; overflow: hidden; display: flex; box-shadow: 0 25px 60px rgba(0,0,0,0.25); position: relative; }
        .panel { flex: 1; padding: 48px 40px; display: flex; flex-direction: column; justify-content: center; }
        .left-panel { background: #0d5c35; }
        .left-panel h1 { color: white; font-size: 26px; margin-bottom: 10px; }
        .left-panel p { color: rgba(255,255,255,0.75); font-size: 13px; line-height: 1.7; margin-bottom: 20px; }
        .feature { display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,0.85); font-size: 13px; margin-bottom: 10px; opacity: 0; transform: translateX(-20px); animation: slideIn 0.5s forwards; }
        .feature:nth-child(3) { animation-delay: 0.1s; }
        .feature:nth-child(4) { animation-delay: 0.2s; }
        .feature:nth-child(5) { animation-delay: 0.3s; }
        .feature:nth-child(6) { animation-delay: 0.4s; }
        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
        .feature-icon { width: 26px; height: 26px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; }
        .right-panel { background: white; }
        .logo { font-size: 20px; font-weight: 700; color: #0d5c35; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: #999; margin-bottom: 24px; }
        label { font-size: 12px; font-weight: 600; color: #555; display: block; margin-bottom: 5px; }
        .input-wrap { margin-bottom: 14px; }
        .input-wrap input { width: 100%; padding: 11px 14px; border: 1.5px solid #e8e8e8; border-radius: 8px; font-size: 14px; outline: none; transition: all 0.2s; background: #fafafa; }
        .input-wrap input:focus { border-color: #1a7a4a; background: white; box-shadow: 0 0 0 3px rgba(26,122,74,0.08); }
        .btn { width: 100%; padding: 12px; background: #1a7a4a; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 4px; }
        .btn:hover { background: #0d5c35; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(13,92,53,0.3); }
        .btn:active { transform: translateY(0); }
        .error { background: #fff0f0; border: 1px solid #ffcccc; color: #c0392b; padding: 9px 13px; border-radius: 7px; font-size: 12px; margin-bottom: 14px; }
        .link { text-align: center; margin-top: 14px; font-size: 13px; color: #999; }
        .link a { color: #1a7a4a; font-weight: 600; text-decoration: none; }
        .divider { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
        .divider span { font-size: 12px; color: #bbb; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #eee; }
        .google-btn { width: 100%; padding: 11px; border: 1.5px solid #e0e0e0; border-radius: 8px; background: white; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s; color: #444; font-weight: 500; }
        .google-btn:hover { border-color: #bbb; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .g-icon { width: 18px; height: 18px; }
        .form-wrap { opacity: 0; transform: translateY(16px); animation: fadeUp 0.5s 0.2s forwards; }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            .container { width: 95%; height: auto; flex-direction: column; }
            .left-panel { display: none; }
            .right-panel { padding: 36px 24px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="panel left-panel">
        <h1>💊 MediShop</h1>
        <p>India's trusted online pharmacy — order medicines from home.</p>
        <div class="feature"><div class="feature-icon">✓</div> 500+ medicines available</div>
        <div class="feature"><div class="feature-icon">✓</div> Prescription upload support</div>
        <div class="feature"><div class="feature-icon">✓</div> Fast doorstep delivery</div>
        <div class="feature"><div class="feature-icon">✓</div> 100% genuine medicines</div>
    </div>
    <div class="panel right-panel">
        <div class="form-wrap">
            <div class="logo">Welcome Back!</div>
            <div class="subtitle">Login to your account</div>
            <div th:if="${error}" class="error" th:text="${error}"></div>
            <button class="google-btn" onclick="alert('Google OAuth coming soon!')">
                <svg class="g-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>
            <div class="divider"><span>or</span></div>
            <form method="post" action="/login">
                <label>Email Address</label>
                <div class="input-wrap">
                    <input type="email" name="email" placeholder="email@example.com" required/>
                </div>
                <label>Password</label>
                <div class="input-wrap">
                    <input type="password" name="password" placeholder="••••••••" required/>
                </div>
                <div style="text-align:right;margin-top:-10px;margin-bottom:14px;">
    <a href="/forgot-password" style="font-size:12px;color:#1a7a4a;text-decoration:none;">Forgot Password?</a>
</div>
                <button class="btn" type="submit">Login →</button>
            </form>
            <div class="link">New here? <a href="/register">Create account</a></div>
        </div>
    </div>
</div>
</body>
</html>
