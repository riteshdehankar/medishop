<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password - MediShop</title>
    <link rel="stylesheet" href="/theme.css"/>
    <script src="/theme.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #0d5c35, #1a7a4a); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 16px; width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .logo { font-size: 22px; font-weight: 700; color: #0d5c35; margin-bottom: 6px; }
        .subtitle { font-size: 13px; color: #999; margin-bottom: 24px; }
        label { font-size: 12px; font-weight: 600; color: #555; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 11px 14px; border: 1.5px solid #e8e8e8; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s; margin-bottom: 16px; }
        input:focus { border-color: #1a7a4a; }
        .btn { width: 100%; padding: 12px; background: #1a7a4a; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #0d5c35; }
        .error { background: #fff0f0; border: 1px solid #ffcccc; color: #c0392b; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
        .success { background: #e8f5ee; border: 1px solid #97c459; color: #27500a; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
        .link { text-align: center; margin-top: 14px; font-size: 13px; color: #999; }
        .link a { color: #1a7a4a; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">🔑 Forgot Password</div>
    <div class="subtitle">Enter your email to reset your password</div>

    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${success}" class="success" th:text="${success}"></div>

    <form method="post" action="/forgot-password">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="email@example.com" required/>
        <button class="btn" type="submit">Reset Password</button>
    </form>
    <div class="link"><a href="/login">← Back to Login</a></div>
</div>
</body>
</html>
