<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/theme.css"/>
<script src="/theme.js"></script>
    <title>Profile - MediShop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f6f8; }
        .navbar { background: #0d5c35; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; }
        .navbar .logo { color: white; font-size: 20px; font-weight: 700; }
        .nav-links a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 13px; padding: 7px 14px; border-radius: 7px; margin-left: 4px; transition: all 0.2s; }
        .nav-links a:hover { background: rgba(255,255,255,0.15); }
        .container { max-width: 680px; margin: 32px auto; padding: 0 20px; }
        h2 { font-size: 22px; font-weight: 700; margin-bottom: 24px; color: #1a1a1a; }
        .card { background: white; border-radius: 14px; padding: 24px; margin-bottom: 16px; border: 1px solid #eee; }
        .card-title { font-size: 15px; font-weight: 700; color: #1a1a1a; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid #f0f0f0; }
        .avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #0d5c35, #1a7a4a); display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; font-weight: 700; margin-bottom: 12px; }
        .user-name { font-size: 20px; font-weight: 700; color: #1a1a1a; }
        .user-email { font-size: 13px; color: #888; margin-top: 3px; }
        .role-badge { display: inline-block; margin-top: 8px; background: #e8f5ee; color: #0d5c35; font-size: 11px; padding: 3px 12px; border-radius: 20px; font-weight: 700; }
        label { font-size: 12px; font-weight: 600; color: #555; display: block; margin-bottom: 5px; margin-top: 12px; }
        input { width: 100%; padding: 11px 14px; border: 1.5px solid #e8e8e8; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s; background: #fafafa; }
        input:focus { border-color: #1a7a4a; background: white; }
        input:disabled { background: #f5f5f5; color: #aaa; cursor: not-allowed; }
        .btn { padding: 11px 24px; background: #1a7a4a; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 16px; transition: background 0.2s; }
        .btn:hover { background: #0d5c35; }
        .success { background: #e8f5ee; border: 1px solid #97c459; color: #27500a; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
        .error { background: #fff0f0; border: 1px solid #ffcccc; color: #c0392b; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo">💊 MediShop</div>
    <div class="nav-links">
        <a href="/shop">Shop</a>
        <a href="/orders">Orders</a>
        <a href="/settings">Settings</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">
    <h2>My Profile</h2>

    <div th:if="${param.success}" class="success">Profile updated successfully!</div>

    <!-- Profile Info Card -->
    <div class="card">
        <div class="avatar" th:text="${#strings.substring(user.name, 0, 1)}"></div>
        <div class="user-name" th:text="${user.name}"></div>
        <div class="user-email" th:text="${user.email}"></div>
        <span class="role-badge" th:text="${user.role}"></span>
    </div>

    <!-- Edit Profile Card -->
    <div class="card">
        <div class="card-title">Edit Profile</div>
        <form method="post" action="/profile/update">
            <label>Full Name</label>
            <input type="text" name="name" th:value="${user.name}" required/>
            <label>Email Address</label>
            <input type="email" th:value="${user.email}" disabled/>
            <label>Phone Number</label>
            <input type="tel" name="phone" th:value="${user.phone}"/>
            <button class="btn" type="submit">Save Changes</button>
        </form>
    </div>

    <!-- Change Password Card -->
    <div class="card">
        <div class="card-title">Change Password</div>
        <div th:if="${passError}" class="error" th:text="${passError}"></div>
        <form method="post" action="/profile/password">
            <label>Current Password</label>
            <input type="password" name="currentPassword" placeholder="••••••••" required/>
            <label>New Password</label>
            <input type="password" name="newPassword" placeholder="••••••••" required/>
            <button class="btn" type="submit">Update Password</button>
        </form>
    </div>
</div>
</body>
</html>
